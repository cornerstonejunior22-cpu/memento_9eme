<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memento 9ème AF</title>

  <!-- PWA & Icon configurations -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#2e7d32">

  <style>
    body { font-family: Arial, sans-serif; padding: 16px; background-color: #f4f6f8; color: #333; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 20px auto; text-align: center; }
    h2 { color: #1b5e20; margin-bottom: 10px; }
    input, button { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; font-size: 16px; }
    button { background-color: #2e7d32; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #1b5e20; }
    .hidden { display: none !important; }
    
    .stats-bar {
      background-color: #e8f5e9;
      color: #1b5e20;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
      border: 1px solid #c8e6c9;
    }

    .question-card {
      background: #ffffff;
      border-radius: 10px;
      padding: 15px;
      margin: 12px 0;
      text-align: left;
      border-left: 5px solid #2e7d32;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .badge-info { display: flex; gap: 6px; font-size: 0.75rem; margin-bottom: 6px; }
    .subject-badge { background: #e8f5e9; color: #2e7d32; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
    .chapter-badge { background: #fff3e0; color: #e65100; padding: 2px 8px; border-radius: 10px; }
    .question-title { font-size: 1rem; color: #1b5e20; margin: 6px 0; }
    .answer-text { font-size: 0.95rem; color: #424242; line-height: 1.4; margin-bottom: 8px; }
    .audio-player audio { width: 100%; height: 36px; margin-top: 6px; }
  </style>

  <!-- Firebase Web SDK (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- Écran de connexion -->
  <div class="card" id="login-screen">
    <h2>Memento 9ème AF</h2>
    <p>Antre kòd daksè ou pou w kòmanse</p>
    <input type="text" id="access-code" placeholder="Kòd daksè">
    <br>
    <button onclick="verifyCode()">KONEKTE</button>
    <p id="error-msg" style="color: red; margin-top: 10px;"></p>
  </div>

  <!-- Écran principal -->
  <div class="hidden" id="home-screen">
    <h2>Memento 9ème AF</h2>
    <div id="stats-info" class="stats-bar">N ap chaje kantite kesyon yo...</div>
    <div id="memento-container"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC7iMR4l-LiVAfyYOPWcSLFvr8mBA2KXA",
      authDomain: "memento-9eme-af.firebaseapp.com",
      projectId: "memento-9eme-af",
      storageBucket: "memento-9eme-af.firebasestorage.app",
      messagingSenderId: "973171461171",
      appId: "1:973171461171:web:01d5s49fe24c632cfbe746",
      measurementId: "G-3Q96R5JTH5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function verifyCode() {
      const code = document.getElementById('access-code').value.trim();
      if (code === "") {
        document.getElementById('error-msg').innerText = "Svp antre yon kòd daksè.";
      } else {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('home-screen').classList.remove('hidden');
        chajeQuestions();
      }
    }

    async function chajeQuestions() {
      const container = document.getElementById('memento-container');
      const stats = document.getElementById('stats-info');
      
      try {
        // Chargement simultané de toutes les collections possibles
        const collectionsToTry = ["questions", "Questions", "questions "];
        let allDocs = [];
        let seenIds = new Set();

        for (const colName of collectionsToTry) {
          try {
            const snap = await db.collection(colName).get();
            snap.forEach(doc => {
              if (!seenIds.has(doc.id)) {
                seenIds.add(doc.id);
                allDocs.push(doc);
              }
            });
          } catch(e) {
            console.log("Erreur chargement " + colName, e);
          }
        }

        container.innerHTML = '';

        if (allDocs.length === 0) {
          stats.innerText = "Sistèm nan jwenn : 0 kesyon.";
          container.innerHTML = '<p style="text-align:center;">Pa gen kesyon pou kounye a.</p>';
          return;
        }

        stats.innerText = `Total : ${allDocs.length} kesyon chaje ak siksè!`;

        allDocs.forEach((doc) => {
          const data = doc.data();
          const card = document.createElement('div');
          card.className = 'question-card';

          const qText = data.questionText || data.question || data.titre || doc.id;
          const aText = data.answerText || data.reponse || data.answer || 'Repons pa disponib';
          const subj = data.subject || data.matiere || '';
          const chap = data.chapter || data.chapitre || '';

          card.innerHTML = `
            <div class="badge-info">
              ${subj ? `<span class="subject-badge">${subj}</span>` : ''}
              ${chap ? `<span class="chapter-badge">${chap}</span>` : ''}
            </div>
            <h3 class="question-title">${qText}</h3>
            <p class="answer-text">${aText}</p>
            
            ${data.audioUrl && data.audioUrl.trim() !== "" ? `
              <div class="audio-player">
                <audio controls preload="none">
                  <source src="${data.audioUrl}" type="audio/mpeg">
                  Navigatè w la pa sipòte lektè audio.
                </audio>
              </div>
            ` : ''}
          `;

          container.appendChild(card);
        });

      } catch (error) {
        console.error("Erè Firestore :", error);
        stats.innerText = "Erè pandan chajman an.";
        container.innerHTML = '<p style="text-align:center; color:red;">Erè nan chaje done yo.</p>';
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
