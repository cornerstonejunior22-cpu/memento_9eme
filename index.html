<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memento 9ème AF</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d32">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f4f6f8;
      color: #333;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 20px auto;
      text-align: center;
    }
    h1, h2 { color: #1b5e20; margin-bottom: 10px; }
    input {
      width: 85%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 90%;
      padding: 12px;
      background-color: #2e7d32;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background-color: #1b5e20; }
    .hidden { display: none !important; }
    
    /* Style pou lis kesyon Firebase yo */
    .question-card {
      background: #ffffff;
      border-radius: 10px;
      padding: 15px;
      margin: 12px 0;
      text-align: left;
      border-left: 5px solid #2e7d32;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .badge-info {
      display: flex;
      gap: 6px;
      font-size: 0.75rem;
      margin-bottom: 6px;
    }
    .subject-badge {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: bold;
    }
    .chapter-badge {
      background: #fff3e0;
      color: #e65100;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .question-title {
      font-size: 1rem;
      color: #1b5e20;
      margin: 6px 0;
    }
    .answer-text {
      font-size: 0.95rem;
      color: #424242;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .audio-player audio {
      width: 100%;
      height: 36px;
      margin-top: 6px;
    }
  </style>

  <!-- Firebase Web SDK (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- Ekran pou antre kòd aksè -->
  <div class="card" id="login-screen">
    <h2>Memento 9ème AF</h2>
    <p>Antre kòd daksè ou pou w kòmanse</p>
    <input type="text" id="access-code" placeholder="Kòd daksè">
    <br>
    <button onclick="verifyCode()">KONEKTE</button>
    <p id="error-msg" style="color: red; margin-top: 10px;"></p>
  </div>

  <!-- Ekran kontni prensipal la -->
  <div class="hidden" id="home-screen">
    <h2>Memento 9ème AF</h2>
    <div id="memento-container">
      <p style="text-align:center;">Chajman kesyon yo...</p>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC7iMR4l-LiVAfyYOPWcSLFvr8mBA2KXA",
      authDomain: "memento-9eme-af.firebaseapp.com",
      projectId: "memento-9eme-af",
      storageBucket: "memento-9eme-af.firebasestorage.app",
      messagingSenderId: "973171461171",
      appId: "1:973171461171:web:01d5s49fe24c632cfbe746",
      measurementId: "G-3Q96R5JTH5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function verifyCode() {
      const code = document.getElementById('access-code').value.trim();
      if (code === "") {
        document.getElementById('error-msg').innerText = "Svp antre yon kòd daksè.";
      } else {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('home-screen').classList.remove('hidden');
        chajeQuestions();
      }
    }

    async function chajeQuestions() {
      const container = document.getElementById('memento-container');
      
      // Li chèche ni nan 'questions' ni nan 'Questions' pou evite erè majuskil
      let querySnapshot = await db.collection("questions").get();
      
      if (querySnapshot.empty) {
        querySnapshot = await db.collection("Questions").get();
      }

      container.innerHTML = '';

      if (querySnapshot.empty) {
        container.innerHTML = '<p style="text-align:center;">Pa gen kesyon pou kounye a.</p>';
        return;
      }

      querySnapshot.forEach((doc) => {
        const data = doc.data();

        const card = document.createElement('div');
        card.className = 'question-card';

        card.innerHTML = `
          <div class="badge-info">
            ${data.subject ? `<span class="subject-badge">${data.subject}</span>` : ''}
            ${data.chapter ? `<span class="chapter-badge">${data.chapter}</span>` : ''}
          </div>
          <h3 class="question-title">${data.questionText || ''}</h3>
          <p class="answer-text">${data.answerText || ''}</p>
          
          ${data.audioUrl && data.audioUrl.trim() !== "" ? `
            <div class="audio-player">
              <audio controls preload="none">
                <source src="${data.audioUrl}" type="audio/mpeg">
                Navigatè w la pa sipòte lektè audio.
              </audio>
            </div>
          ` : ''}
        `;

        container.appendChild(card);
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
